<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"/>
    <title>ГрузGo — Доставка грузов межгород. Безопасно. Быстро. В целости и сохранности!</title>
    <style>
        @font-face {
            font-family: "Roboto";
            src: url("fonts/Roboto-Regular.ttf");
            font-weight: normal;
        }

        @font-face {
            font-family: "Roboto";
            src: url("fonts/Roboto-Bold.ttf");
            font-weight: bold;
        }

        @font-face {
            font-family: "Roboto";
            src: url("fonts/Roboto-Medium.ttf");
            font-weight: 500;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            color: #111111;
            font-family: "Roboto", sans-serif;
        }

        body {
            background: #FDFDFD;
        }

        .container {
            overflow: hidden;
            min-height: 100vh;
        }

        .header {
            border-radius: 18px;
            box-shadow: 0 7px 20px 0 #0000002E;
            backdrop-filter: blur(10px);
            background: #ffffff;
            left: 20px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            position: fixed;
            right: 20px;
            top: 20px;
            padding: 14px 18px;
            height: 70px;
            display: flex;
            align-items: center;
            z-index: 6;
        }

        .header-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 10px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #FFCC00;
            display: grid;
            place-items: center;
            font-weight: bold;
            color: #111;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #111111;
            text-decoration: none;
        }

        .header-menu {
            display: flex;
            align-items: center;
            gap: 60px;
            margin: 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .header-link {
            font-size: 14px;
            color: #111111;
            text-decoration: none;
        }

        .main {
            padding: 111px 40px 40px;
            position: relative;
            display: flex;
        }

        .main-info {
            max-width: 840px;
            width: 100%;
            position: relative;
        }

        .main-title {
            margin-top: 98px;
            font-weight: 500;
            font-size: 200px;
            line-height: 1;
            letter-spacing: -0.05em;
            color: #111111;
            left: -15px;
            position: relative;
        }

        .main-title span {
            color: #ffcc00;
        }

        .main-features {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .main-feature {
            background: #111111;
            color: #ffffff;
            padding: 12px 14px;
            font-weight: 500;
            font-size: 14px;
            line-height: 1.1;
            border-radius: 10px;
        }

        .main-description {
            margin-top: 50px;
            max-width: 500px;
            font-size: 20px;
            line-height: 1.1;
            color: #111111;
        }

        .main-actions {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-actions .button {
            height: 80px;
            width: 433px;
            font-size: 18px;
            font-weight: bold;
            place-items: center;
            display: grid;
        }

        .button {
            border: 0;
            outline: none;
            height: 44px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: transform .08s ease, opacity .12s ease;
            background: #ffcc00;
            color: #111111;
            text-align: center;
            text-decoration: none;
        }

        .button:hover {
            background-color: #E5BC19;
        }

        .button:disabled {
            cursor: not-allowed;
            background-color: #FADE6E;
            color: #787878;
            transform: none;
        }

        .button.button-white {
            background: #ffffff;
            border: 1px solid #111111;
        }

        .button.button-white:hover {
            background: rgb(241 241 241);
        }

        .main-title-ghost {
            position: absolute;
            z-index: -1;
            left: -70px;
            bottom: -150px;
            font-weight: 500;
            font-size: 278px;
            line-height: 1;
            letter-spacing: -0.05em;
            color: #ECEDF04D;
        }

        .main-image {
            width: 1024px;
            top: 100px;
            z-index: -2;
        }

        .main-image img {
            width: 100%;
            max-width: 1024px;
            height: auto;
            display: block;
        }

        /* ===== Адаптивные стили ===== */

        /* Большие экраны до 1760px */
        @media (max-width: 1760px) {
            .main-title {
                font-size: 150px;
                left: -7px;
            }

            .main-info {
                max-width: 640px;
            }
        }

        /* Ноутбуки до 1200px */
        @media (max-width: 1200px) {
            .main-info {
                max-width: 540px;
            }

            .main {
                padding: 111px 20px 20px;
            }

            .main-title {
                font-size: 120px;
                left: -4px;
            }

            .main-title-ghost {
                font-size: 220px;
            }
        }

        /* Планшеты до 1024px */
        @media (max-width: 1024px) {
            .main-title {
                margin-top: 30px;
            }

            .main {
                flex-direction: column-reverse;
            }

            .main-image {
                max-width: 350px;
                position: absolute;
                left: 370px;
                top: 370px;
            }

            .main-info {
                max-width: 100%;
            }

            .main-actions {
                gap: 10px;
            }

            .main-actions .button {
                height: 50px;
                font-size: 14px;
                width: auto;
                max-width: 300px;
            }

            .main-description {
                max-width: 350px;
            }
        }

        /* Телефоны до 767px */
        @media (max-width: 767px) {
            .header {
                left: 10px;
                right: 10px;
                top: 10px;
            }

            .header-link span {
                display: none;
            }

            .header-menu {
                gap: 20px;
                justify-content: flex-start;
                margin: 0 0 0 30px;
                position: static;
                transform: none;
            }
        }

        /* Телефоны до 570px */
        @media (max-width: 570px) {
            .main-title {
                font-size: 88px;
            }

            .main-description {
                max-width: 100%;
            }

            .main-actions {
                width: 100%;
            }

            .main-actions .button {
                width: 100%;
                max-width: 100%;
            }

            .main-image {
                max-width: 650px;
                position: absolute;
                left: 170px;
                top: 70px;
                opacity: 0.2;
            }
        }

        /* Маленькие телефоны до 420px */
        @media (max-width: 420px) {
            .header-title {
                display: none;
            }
        }

        /* Маленькие телефоны до 400px */
        @media (max-width: 400px) {
            .main-title {
                font-size: 70px;
            }
        }

        /* Очень маленькие экраны до 374px */
        @media (max-width: 374px) {
            .header-menu {
                gap: 10px;
                margin: 0 0 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a class="header-brand" href="#">
                <div class="header-logo">Г</div>
                <div class="header-title">ГрузGo</div>
            </a>
            <nav class="header-menu">
                <a class="header-link" href="#">Оформить <span>доставку</span></a>
                <a class="header-link" href="#">Отследить <span>груз</span></a>
            </nav>
        </header>

        <main class="main">
            <section class="main-info">
                <div class="main-title">
                    <span>Г</span>рузGo
                </div>

                <div class="main-features">
                    <div class="main-feature">Отслеживание 24/7</div>
                    <div class="main-feature">Лучшие маршруты</div>
                    <div class="main-feature">Страхование грузов</div>
                    <div class="main-feature">Доставка в срок</div>
                    <div class="main-feature">Выгодные тарифы</div>
                </div>

                <div class="main-description">
                    Доставка грузов межгород САРАНСК ПЕНЗА НИЖНИЙ НОВГОРОД.
                    Безопасно. Быстро. В целости и сохранности!
                </div>

                <div class="main-actions">
                    <a class="button" type="button" href="./order.html">Заказать доставку</a>
                    <a class="button button-white" type="button" href="./track.html">Отследить груз</a>
                </div>

                <div class="main-title-ghost">ГрузGo</div>
            </section>

            <section class="main-image">
                <img src="images/main-image.png" alt="Main image"/>
            </section>
        </main>
    </div>
</body>
</html>
